
name: GOLD BOT Backend Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONTZPATH: ""

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gold_bot_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gold_bot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Enable PostgreSQL btree_gist extension
        env:
          DATABASE_URL: postgresql://postgres:postgres_test_password@localhost:5432/gold_bot_test
        run: |
          python -c "import os, psycopg; connection = psycopg.connect(os.environ['DATABASE_URL']); connection.execute('CREATE EXTENSION IF NOT EXISTS btree_gist'); connection.commit(); connection.close()"

      - name: Check Python syntax
        run: python -m compileall -q app tests scripts

      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres_test_password@localhost:5432/gold_bot_test
        run: alembic upgrade head

      - name: Run backend tests
        env:
          MARKET_TIME_TEST_DATABASE_URL: postgresql://postgres:postgres_test_password@localhost:5432/gold_bot_test
        run: python -m pytest -q
